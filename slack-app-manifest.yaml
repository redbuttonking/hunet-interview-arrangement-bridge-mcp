display_information:
  name: Interview Arrangement Bridge
  description: Collects interviewer availability for approved interview requests.
  background_color: "#4A154B"
features:
  bot_user:
    display_name: Interview Arrangement Bridge
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
